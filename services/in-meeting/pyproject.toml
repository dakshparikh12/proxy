[project]
name = "in-meeting"
version = "0.0.0"
description = "services.in-meeting — the in-meeting engine: connections, loop, safeguards."
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "agentkit",
    "db",
    "http",
    "llm",
    "claude-agent-sdk>=0.2.115",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[tool.uv.sources]
contracts = { workspace = true }
agentkit = { workspace = true }
db = { workspace = true }
http = { workspace = true }
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/in_meeting"]
