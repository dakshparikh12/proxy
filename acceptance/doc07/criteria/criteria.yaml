- criterion_id: AC-PME-14
  name: partial and failed are reported plainly and the confidence signal never rounds up
  evidence_class: '[unit-property]'
  authority_refs:
  - R-doc07-PME-14
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: null
  verification_ladder:
  - tier: lint
  - tier: unit
  behavior:
    given: Workroom envelopes across the full status enum {done, partial, failed, needs_clarification, needs_review}.
    when: The report and its confidence signal are rendered for each.
    then:
    - partial renders as needs-attention and failed renders as plainly failed with its reason
    - The confidence signal is never more favourable than the envelope status permits
    - done is the only status that renders as confident
    - The failure reason from the envelope is present in the report, not summarised away
  applicability:
    fixtures: [fixture-envelope-status-matrix]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Law 2 is a total function over the status enum; property coverage is exhaustive and cheap."
  primary_oracle:
    type: invariant
    artifact: "for every status s: assert confidence_rank(report(s)) <= confidence_rank(s)"
  thresholds:
    confidence_rounded_up: 0
    failure_reasons_dropped: 0
  fault_model_refs:
  - F-PARTIAL-REPORTED-AS-DONE
  - F-FAILURE-REASON-SWALLOWED
  test_ids:
  - T-PME-14

# ── WHAT LANDS IN THE WORLD ───────────────────────────────────────────────────
- criterion_id: AC-PME-15
  name: The artifact is a proposed staged draft with receipts, and is never pushed
  evidence_class: '[security-adversarial]'
  authority_refs:
  - R-doc07-PME-15
  criticality: P0
  blocking: true
  golden_path: true
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres and a real GCS bucket (or its versioned local double) for the bundle;
    the git remote is observed for zero write operations and is never replaced by a
    permissive stub
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  - tier: e2e
  behavior:
    given: A completed task that produced a multi-file code change.
    when: The artifact is staged via propose_change.
    then:
    - A staged_drafts row exists with status exactly 'proposed'
    - The row carries a draft_id and the bundle is retrievable from GCS
    - The draft carries receipts grounding its claims
    - No push, no branch creation on the remote, and no pull request occurs
    - The GitHub App token in use carries no contents:write scope
  applicability:
    fixtures: [fixture-code-change-task]
    estates: [small-clean]
    excluded_estates: []
    rationale: "This is the doc's irreversible-action boundary and must run against the real substrate."
  primary_oracle:
    type: invariant
    artifact: >-
      assert staged_drafts.status == 'proposed' and draft_id is not None and
      git_remote.write_operations == 0 and 'contents:write' not in token_scopes
  thresholds:
    pushes: 0
    pull_requests_opened: 0
    drafts_at_wrong_status: 0
  fault_model_refs:
  - F-PUSH-ON-ACCEPT
  - F-DRAFT-WRITTEN-AT-NEEDS-REVIEW
  notes:
    schema_gap: >-
      The staged_drafts.status column is plain text with DEFAULT 'proposed' and NO CHECK
      constraint enumerating proposed|accepted|rejected|applied
      (migrations/versions/0001_substrate.py:134-144, audit 2026-07-27). CANONICAL §4
      line 125 documents the enum in a comment only. This criterion therefore asserts the
      value explicitly rather than relying on the database to reject a wrong one, and a
      CHECK constraint is recommended as a follow-up so the enum is enforced where it is
      declared.
  test_ids:
  - T-PME-15

- criterion_id: AC-PME-16
  name: Reports use only a channel-report channel, reach owner and named recipients, on four events only
  evidence_class: '[contract]'
  authority_refs:
  - R-doc07-PME-16
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; the channel senders are observed for call sites and are never
    replaced by a stub that would accept an unlisted channel
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  behavior:
    given: >-
      A task reaching each of the four reportable events (completion, question, failure,
      cost ask) plus several non-reportable intermediate steps, for a tenant whose
      channel-report lists a known channel set.
    when: Reporting runs.
    then:
    - Every report is delivered on a channel present in that meeting's channel-report
    - No report is delivered on a channel absent from channel-report
    - Each report reaches the task owner and every recipient the room explicitly named
    - Reports are emitted on exactly the four reportable events and on no intermediate step
  applicability:
    fixtures: [fixture-report-event-matrix]
    estates: [small-clean, multi-tenant]
    excluded_estates: []
    rationale: "Channel sets are per-tenant; multi-tenant proves a channel never leaks across tenants."
  primary_oracle:
    type: contract_check
    artifact: >-
      assert set(channels_used) <= set(channel_report_for_meeting) and
      report_events == {completion, question, failure, cost_ask}
  thresholds:
    reports_on_unlisted_channel: 0
    reports_on_intermediate_steps: 0
    named_recipients_missed: 0
  fault_model_refs:
  - F-REPORT-ON-UNLISTED-CHANNEL
  - F-PER-STEP-CHATTER
  notes:
    p6_deferred: >-
      P6 (Slack via channel-report) was DEFERRED by founder call because Doc 08 draft cards
      are BUILT (libs/contracts/src/contracts/channel.py:163 class DraftCard;
      libs/contracts/src/contracts/registry.py:72 DRAFT_CARD; and
      services/transport/src/transport/chat.py:339 format_draft_card). Draft cards are
      therefore Doc 07's report surface in V1, and this criterion is NOT blocked on an
      out-of-meeting channel. If P6 later lands, slack_dm_available joins the channel set
      this criterion reads and no assertion here changes.
  test_ids:
  - T-PME-16
