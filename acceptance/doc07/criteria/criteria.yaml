  applicability:
    fixtures: [fixture-ownership-decoys]
    estates: [small-clean]
    excluded_estates: []
    rationale: "The decoys are the point; a synthetic corpus exercises them precisely."
  primary_oracle:
    type: invariant
    artifact: "for each item without a stated owner: assert owner == 'UNRESOLVED' and owner not in {senior_speaker, dominant_speaker, last_file_author}"
  thresholds:
    inferred_owners: 0
    unresolved_conflated_with_empty: 0
  fault_model_refs:
  - F-OWNER-INFERRED-FROM-SENIORITY
  - F-UNRESOLVED-STORED-AS-EMPTY
  test_ids:
  - T-PME-05

