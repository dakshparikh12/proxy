[project]
name = "premeeting"
version = "0.0.0"
description = "services.premeeting — connect/clone/map-build/store/verify + the live-search toolbelt."
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "agentkit",
    "db",
    "http",
    "cryptography>=42",
    "claude-agent-sdk>=0.2.128",
]

[tool.uv.sources]
contracts = { workspace = true }
agentkit = { workspace = true }
db = { workspace = true }
http = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/premeeting"]
