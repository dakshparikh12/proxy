[project]
name = "proxy-live-test-harness"
version = "0.0.0"
description = "Operator-driven, chunk-by-chunk live-meeting replay harness for Proxy."
requires-python = ">=3.12"
# No third-party deps of its own: it reuses the workspace venv (httpx via the
# libs.http seam, the product transport, output_media). Nothing new to install.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

# Deliberately NOT a uv workspace member: it is a standalone operator tool under
# live-test/, run against the repo's existing .venv (see README). Kept out of the
# root [tool.uv.workspace] members so the product gate never depends on it.
