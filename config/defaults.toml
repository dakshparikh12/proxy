# Proxy tunables — one value + unit + range per key; code reads this file.
# Env overrides are for secrets/seats only (never these operational tunables).

[ops]
# A running operation_runs row whose last_heartbeat_at is older than this many
# seconds is considered orphaned and swept to 'interrupted' (lazy on read + boot
# bulk sweep + reconcile cron). unit: seconds. range: 10..300.
stale_after_s = 40
# Heartbeat cadence for a live owner's fencing UPDATE. unit: seconds. range: 1..30.
heartbeat_s = 10
# Reconcile cron cadence (scale-to-zero safe). unit: seconds. range: 60..900.
reconcile_interval_s = 300

[sandbox]
# E2B-native sandbox timeout backstop set at provision. unit: seconds. range: 300..7200.
timeout_s = 3600
# TTL past which the reconcile sweep destroys a leaked sandbox. unit: seconds. range: 300..7200.
ttl_s = 3600
# The per-sandbox MCP-over-HTTP tool-transport sidecar port inside E2B (§3.5). The host
# builds the sandbox MCP URL from get_host(this port). unit: port. range: 1024..65535.
mcp_port = 8081
# Short-TTL of the per-sandbox HS256 JWT the token_provider mints (§3.5). A sandbox handle
# can live the whole meeting; the token is re-minted within the refresh margin of exp so a
# long build never hits expiry. unit: seconds. range: 300..3600.
jwt_ttl_s = 900
# Re-mint margin: the token_provider re-signs once the cached JWT is within this many
# seconds of exp (~5 min) — read exp from the token itself, no TTL duplication. unit:
# seconds. range: 60..600.
jwt_refresh_margin_s = 300

[stt]
# In-process STT credential refresh cadence (availability-critical; never the
# reconcile cron). unit: seconds. range: 60..3600.
refresh_interval_s = 600

[llm]
# Per-meeting model-call fan-out (distinct from the process-wide
# PROXY_MAX_INFLIGHT_LLM=16 semaphore). unit: concurrent calls. range: 3..5.
per_meeting_concurrency = 4

[latency_slo]
# Direct-answer shallow-path SLOs (CANONICAL §12.8) — the pinned foundation
# latency contract the pre-build spike gate (M15) and the answer path measure
# against. unit: seconds.
first_text_p50_s = 2.0    # first streamed text, median. range: 1.0..4.0
first_text_p95_s = 4.0    # first streamed text, tail. range: 2.0..8.0
first_audio_p50_s = 2.5   # first audible token, median. range: 1.0..5.0
first_audio_p95_s = 5.0   # first audible token, tail. range: 2.0..10.0
# The "on it" acknowledgement reflex SLO — Proxy must be audibly acking within
# this budget of a wake. unit: milliseconds. range: 200..800.
ack_audible_p95_ms = 500

[transport]
# Doc 02 (Voice & Transport) non-§12.8 tunables. The §12.8-pinned latency SLOs stay
# single-homed in [latency_slo] above (reused, never redeclared — AC-XCUT-09); only
# numbers NOT pinned by §12.8 live here.
# Output-Media audio chunk size. Small by design so a barge-in flush drops at most one
# in-flight chunk (§3.3, AC-SPEAK-08). MUST stay below barge_in_budget_ms: the one chunk
# that survives a flush is residual playout, and it may not exceed the 200ms stop budget
# (AC-TURN-10). 120ms leaves ~80ms headroom for detect+abort+flush. unit: milliseconds.
# range: 50..200 (AC-SPEAK-08 ceiling 250, tightened here by the AC-TURN-10 stop budget).
tts_chunk_ms = 120
# Max audio buffered ahead in Output Media, so buffered audio can't defeat barge-in: a
# surviving in-flight chunk stays within the 200ms stop budget (§3.3, AC-TURN-10). Kept
# equal to tts_chunk_ms (~one chunk ahead). unit: milliseconds. range: 50..200.
max_buffered_audio_ms = 120
# Barge-in stop budget: human onset → TTS silence (§3.6/§4/Law-3; NOT §12.8-pinned, so
# home here). unit: milliseconds. range: 100..200.
barge_in_budget_ms = 200
# Barge-in ONSET debounce (D-037/D-043): a non-Proxy speaker must sustain speech at least this
# long before it counts as a real interruption — a shorter blip (cough / "mm" / chair scrape) is
# NOT an interruption and never cuts Proxy. Once a real onset fires, the cut still lands within
# barge_in_budget_ms. unit: milliseconds. range: 150..250.
barge_in_onset_min_ms = 200
# Headline-only spoken envelope (§3.3): a single spoken line over this soft cap is
# detail — routed to chat, not synthesized. unit: characters. range: 120..320.
headline_char_soft_cap = 240
# Aggregate spoken characters synthesized per meeting-hour (the ~2-4k design envelope,
# the speak-short/detail-in-chat cost lever). unit: characters/hour. range: 2000..4000.
max_spoken_chars_per_hour = 4000
# Shared Recall-workspace outbound budget the per-bot never-drop queue paces against
# (§3.7, AC-FAIL-14/15/16): the floor sends/second across Output-Media + chat. A burst
# waits on this window rather than being dropped. unit: sends/second. range: 1..10.
outbound_sends_per_second = 4
# Managed transport rate card (§4) — the SINGLE source of the per-component rates that
# BOTH the cost-floor check (AC-SEAM-13) and the elapsed×rate accrual (AC-SEAM-14) use,
# so the floor binds real accrued spend (AC-SEAM-22). unit: USD/meeting-hour.
bot_usd_per_hr = 0.50    # Recall bot. range: 0.40..0.60
stt_usd_per_hr = 0.15    # AssemblyAI via Recall BYOK passthrough. range: 0.10..0.20
tts_usd_per_hr = 0.15    # Cartesia Sonic 3, within the $0.10-0.20 band. range: 0.10..0.20
# Rejoin budget is PER-EPISODE (D-038/D-043): a drop spends a rejoin, but after the bot
# stays connected for this long the budget RESETS — so a later, unrelated Wi-Fi hiccup can
# rejoin again. A total per-meeting cap bounds rapid flapping to an honest terminal stop.
# unit: seconds of sustained connection before the budget re-arms. range: 300..1800.
rejoin_reset_after_connected_s = 900
# Hard ceiling on total auto-rejoins in one meeting; the (cap+1)-th drop is an honest stop,
# never an unbounded retry loop (bounds abuse). unit: count. range: 2..5.
rejoin_cap_per_meeting = 3
