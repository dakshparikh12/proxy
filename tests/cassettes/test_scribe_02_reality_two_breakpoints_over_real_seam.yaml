      At S\",\"type\":\"number\"},\"firmness\":{\"$ref\":\"#/$defs/Firmness\"},\"provenance\":{\"$ref\":\"#/$defs/Provenance\"},\"verified\":{\"default\":false,\"title\":\"Verified\",\"type\":\"boolean\"},\"referents\":{\"items\":{\"type\":\"string\"},\"maxItems\":8,\"title\":\"Referents\",\"type\":\"array\"},\"contradicts\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Contradicts\"}},\"required\":[\"text\",\"speaker\",\"said_at_s\",\"firmness\",\"provenance\"],\"title\":\"Claim\",\"type\":\"object\"},\"CloseOp\":{\"properties\":{\"op\":{\"const\":\"close\",\"default\":\"close\",\"title\":\"Op\",\"type\":\"string\"},\"target_id\":{\"title\":\"Target
      Id\",\"type\":\"string\"},\"resolution\":{\"maxLength\":300,\"title\":\"Resolution\",\"type\":\"string\"}},\"required\":[\"target_id\",\"resolution\"],\"title\":\"CloseOp\",\"type\":\"object\"},\"ContextLine\":{\"properties\":{\"kind\":{\"const\":\"context\",\"default\":\"context\",\"title\":\"Kind\",\"type\":\"string\"},\"text\":{\"maxLength\":500,\"title\":\"Text\",\"type\":\"string\"}},\"required\":[\"text\"],\"title\":\"ContextLine\",\"type\":\"object\"},\"Decision\":{\"properties\":{\"kind\":{\"const\":\"decision\",\"default\":\"decision\",\"title\":\"Kind\",\"type\":\"string\"},\"text\":{\"maxLength\":1000,\"title\":\"Text\",\"type\":\"string\"},\"status\":{\"$ref\":\"#/$defs/DecisionStatus\"},\"reversibility\":{\"$ref\":\"#/$defs/Reversibility\"},\"leans\":{\"additionalProperties\":{\"enum\":[\"for\",\"against\",\"silent\"],\"type\":\"string\"},\"title\":\"Leans\",\"type\":\"object\"},\"referents\":{\"items\":{\"type\":\"string\"},\"maxItems\":8,\"title\":\"Referents\",\"type\":\"array\"}},\"required\":[\"text\",\"status\",\"reversibility\"],\"title\":\"Decision\",\"type\":\"object\"},\"DecisionStatus\":{\"enum\":[\"forming\",\"final\"],\"title\":\"DecisionStatus\",\"type\":\"string\"},\"Firmness\":{\"enum\":[\"firm\",\"hedged\",\"speculative\"],\"title\":\"Firmness\",\"type\":\"string\"},\"OpenQuestion\":{\"properties\":{\"kind\":{\"const\":\"open_question\",\"default\":\"open_question\",\"title\":\"Kind\",\"type\":\"string\"},\"text\":{\"maxLength\":1000,\"title\":\"Text\",\"type\":\"string\"},\"raised_by\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Raised
      By\"},\"positions\":{\"items\":{\"type\":\"string\"},\"maxItems\":12,\"title\":\"Positions\",\"type\":\"array\"},\"resolved\":{\"default\":false,\"title\":\"Resolved\",\"type\":\"boolean\"}},\"required\":[\"text\"],\"title\":\"OpenQuestion\",\"type\":\"object\"},\"PatchOp\":{\"properties\":{\"op\":{\"const\":\"patch\",\"default\":\"patch\",\"title\":\"Op\",\"type\":\"string\"},\"target_id\":{\"title\":\"Target
      Id\",\"type\":\"string\"},\"changes\":{\"additionalProperties\":true,\"title\":\"Changes\",\"type\":\"object\"},\"supersede_reason\":{\"maxLength\":300,\"title\":\"Supersede
