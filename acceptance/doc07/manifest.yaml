# ── Honest limits of this seal (GENERATOR.md §2.2) ───────────────────────────
assurance_limits:
  blocked_criteria:
    count: 4
    ids: [AC-PME-09, AC-PME-09-NEG, AC-PME-10, AC-PME-10-NEG]
    dependency: "meeting_runtime worker runnable with no media session"
    detail: >-
      Doc 07 §3.5 requires the Workroom to run in a meeting_runtime worker with no media
      session while also asserting "No new deployable". MeetingRuntime
      (services/harness/src/harness/meeting_runtime.py:54) is media-coupled by construction
      and has no no-media entrypoint. These four criteria are sealed and blocking, but
      CANNOT be executed until that worker exists or §3.5 is amended. A green run of this
      bundle that omits them is NOT a green bundle.
  tests_not_authored: >-
    Every criterion declares test_ids, but no test bodies exist yet. Sealing fixes the
    contract, not the evidence — per §1.1 acceptance is authored before implementation.
  no_evidence_yet: >-
    No execution evidence is attached to this seal. Per §1.6 evidence from a different
    bundle, build, verifier, or environment does not satisfy this gate.
  generator_limits: >-
    A green bundle would not prove Doc 07's spec contains every real-world requirement,
    that unmodeled state cannot fail, or that the fault models below are exhaustive.

builder_writes: DENIED
