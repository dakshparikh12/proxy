  evidence_class: '[eval]'
  authority_refs:
  - R-doc07-PME-06
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: vendor:anthropic
  mock_boundary: >-
    may mock the Anthropic HTTP response body via a vcrpy cassette at the
    call_external/transport layer; MUST NOT replace the call_external seam or the
    structured triage request construction with Mock()
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: reality
  blocked:
    status: BLOCKED
    blocking_dependency: libs/llm structured-output entrypoint on the sonnet seat
    dependency_owner: libs/llm
    evidence: >-
      Same as AC-PME-01: libs/llm exposes call_model() only; no structured-output surface
      (audit 2026-07-27).
    consequence: >-
      Tier assignment is model judgment per Doc 07 §3.1 and Law 4 ("no rule table mapping
