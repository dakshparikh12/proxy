# ══════════════════════════════════════════════════════════════════════════════
# PAIRED NEGATIVE CRITERIA (GENERATOR.md §8.4.1)
# One per non-null-dependency_class positive. Each asserts that when the dependency
# errors, times out, or returns malformed data, the system degrades correctly: honest
# failure, no silent proceed, no corruption. Ladders terminate in the `negative` tier.
# Derived from their positives — each names the specific fault its positive is blind to.
# ══════════════════════════════════════════════════════════════════════════════

- criterion_id: AC-PME-01-NEG
  name: Triage degrades honestly when the model errors, times out, or returns malformed output
  evidence_class: '[fault-injection]'
  authority_refs:
  - R-doc07-PME-01
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: vendor:anthropic
  mock_boundary: >-
    negative cassette only (recorded 5xx, timeout, and truncated/non-conforming JSON body)
    at the call_external layer; MUST NOT replace the seam — the real error path must execute
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: negative
  behavior:
    given: A close output whose triage call is driven against a negative cassette (5xx, timeout, truncated body, and schema-violating JSON in turn).
    when: Triage runs.
    then:
    - No action item is assigned a tier on the strength of a failed or malformed response
    - The failure is surfaced plainly and is not silently converted into the informational tier
    - The close record remains byte-identical
    - The run does not proceed to planning for any untiered item
  applicability:
    fixtures: [fixture-triage-negative-cassettes]
    estates: [small-clean]
    excluded_estates: []
    rationale: "The failure path is where an unhelpful default tier would silently appear."
  primary_oracle:
    type: fault_injection_check
    artifact: "for each negative cassette: assert no tier persisted, error surfaced, close_record unchanged"
  thresholds:
    tiers_assigned_from_failed_response: 0
    silent_defaults_to_informational: 0
  fault_model_refs:
  - F-TRIAGE-DEFAULTS-ON-ERROR
  - F-MALFORMED-VERDICT-ACCEPTED
  test_ids:
  - T-PME-01-NEG

