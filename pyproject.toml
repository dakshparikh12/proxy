[project]
name = "proxy"
version = "0.0.0"
description = "Proxy — AI meeting participant (monorepo root)."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.ruff]
line-length = 120
# The sealed acceptance tests under tests/ are not product code; the ruff style
# gate applies to the services/ + libs/ product surface. force-exclude honours
# these even when the paths are passed explicitly.
extend-exclude = ["tests", ".venv", "services/in-meeting/proof"]
force-exclude = true

[tool.bandit]
# The security gate is the services/ + libs/ PRODUCT surface; the sealed tests under any
# ``tests/`` dir (incl. nested ``services/*/tests``) are not product code — they legitimately
# use asserts + fixtures. The secret gate (B105) and shell-injection gate (B602) stay ACTIVE:
# their few intentional hits are ``# nosec``'d PER LINE (verified false-positives / the
# in-sandbox run_command), so a NEW hardcoded secret or host ``shell=True`` still trips.
exclude_dirs = ["tests", ".venv", "build", "migrations"]
# Systemically-benign categories, skipped with justification:
#   B101 assert — invariant checks (the product runs without ``-O``)
#   B110 try/except/pass — the Rule-6 fail-closed degradation idiom (handlers never throw)
#   B404 import subprocess — subprocess is legitimately used (alembic/git + host sandbox tooling)
#   B603 subprocess call, no shell — the SAFE list-arg form (host ``shell=True`` is separately gated)
#   B607 partial executable path — PATH tools (alembic/git) invoked by name, by design
skips = ["B101", "B110", "B404", "B603", "B607"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
# The ``libs/<pkg>/__init__.py`` facade shims are runtime ``sys.modules`` aliases to the
# canonical bare package (one class identity) — they hold no static surface, so checking them
# directly makes every ``from libs.<pkg> import X`` importer see an empty namespace. Exclude the
# shims from the check TARGETS (the real source under ``libs/<pkg>/src/<pkg>`` stays fully
# ``--strict``-checked); the ``libs.*`` override below then treats the facade as opaque on import.
# The service-local ``tests/`` dirs (incl. nested ``services/*/tests``) are NOT product code —
# they legitimately use fakes/dynamic fixtures; the ``--strict`` static gate covers the product
# surface only (matching the ruff + bandit ``tests`` excludes above).
exclude = ['^libs/[^/]+/__init__\.py$', '(^|/)tests/', 'services/in-meeting/proof/']

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "asyncpg", "asyncpg.*", "psycopg", "psycopg.*", "psycopg_pool", "psycopg_pool.*",
    "alembic", "alembic.*", "testing", "testing.*", "uvicorn", "uvicorn.*",
    "authlib", "authlib.*",
    # ``limits`` (+ optional ``slowapi``) back the doc02 outbound rate gate (AC-FAIL-16),
    # provisioned on the meeting_runtime estate; ships no type stubs.
    "limits", "limits.*", "slowapi", "slowapi.*",
    # Optional observability / AI SDK deps that ship no stubs.
    "langfuse", "langfuse.*", "sentry_sdk", "sentry_sdk.*", "structlog", "structlog.*",
    "httpx", "httpx.*", "anthropic", "anthropic.*",
    # E2B sandbox SDK — the Workroom's raw client (libs/http is its sole home); ships no stubs
    # and is an optional/integration-tier dep imported lazily, so it may be absent in the CI
    # static env. The import is scoped to libs/http; no product module outside it imports e2b.
    "e2b", "e2b.*", "e2b_code_interpreter", "e2b_code_interpreter.*",
    "fastapi", "fastapi.*", "starlette", "starlette.*",
    "cryptography", "cryptography.*",
    # GCS SDK — the finalized-notes Plane 2 store (§3.3); ships no type stubs and
    # is an optional/integration-tier dep (imported lazily inside the writer).
    "google", "google.*", "google.cloud", "google.cloud.*",
    "google.api_core", "google.api_core.*", "google.api_core.exceptions",
    # The deterministic symbol-map stack (premeeting/symbol_map.py): the Aider tree-sitter +
    # PageRank deps. networkx/grep_ast/tree_sitter_language_pack ship no type stubs.
    "networkx", "networkx.*", "grep_ast", "grep_ast.*",
    "tree_sitter_language_pack", "tree_sitter_language_pack.*",
]
ignore_missing_imports = true

# Cross-package workspace imports (src-layout): a member importing another member by
# its installed top-level name (e.g. ``from contracts.channels import ...``) resolves
# at runtime via the editable install, but the strict walk names the same source by
# its filesystem path (``libs.contracts.src.contracts``), so the import can't be tied
# back to the checked source without a dual-name collection error. Silence the missing
# import for the top-level name; the module's own source is still fully strict-checked
# under its walk name. (Doc 02 transport is the first cross-member runtime importer;
# it imports both ``contracts`` and ``agentkit`` — the AbortRegistry reused for barge-in.)
[[tool.mypy.overrides]]
module = ["contracts.*", "agentkit.*", "control_plane.*", "premeeting.*", "in_meeting.*", "transport.*", "workroom.*", "db.*"]
ignore_missing_imports = true

# ``libs.contracts`` binds itself to the canonical ``contracts`` package via a runtime
# ``sys.modules`` alias (ONE class identity per wire shape — see ``libs/contracts/__init__.py``;
# a second execution would split ``isinstance`` + the registry, the Doc-09 §2 re-drift). mypy
# cannot follow that dynamic bind, so it sees an empty facade and reports spurious ``no
# attribute`` on the ``from libs.contracts import X`` form. Treat it as opaque WHEN IMPORTED;
# the canonical surface is still fully ``--strict``-checked under its bare name ``contracts.*``.
[[tool.mypy.overrides]]
module = ["libs.contracts", "libs.contracts.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ``libs.lint`` facade submodules mypy can't resolve to a checked source (the real code is
# checked under the bare name). Silence only the missing-import.
[[tool.mypy.overrides]]
module = ["libs.lint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The whole-product test universe: the root cross-service suites PLUS every workspace member's
# own tests (services/*/tests + libs/*/tests). The gate must see them all — a per-service suite
# that is not collected here is an invisible, unguarded regression (a suite left out here once let
# 4 stale-RED per-service tests hide from `bash scripts/signoff.sh`, which runs a bare pytest).
# Any new member that grows a tests/ dir MUST be added to this list.
testpaths = [
    "tests",
    "services/premeeting/tests",
    "services/in-meeting/tests",
    "services/control-plane/tests",
    "libs/agentkit/tests",
]
norecursedirs = [".venv", "node_modules", "fixtures"]
# doc00 and doc01 each ship a `test_w_workflows.py` / `conftest.py` (no package
# __init__.py); the default prepend import mode collides on the shared basenames.
# importlib mode imports each by full path — no sys.path games, no collision.
# -p no:testmon: agents kept running `pytest --testmon -m "not reality..."` (the full
# offline suite) during audits; testmon's cold-start turns the 2.5min suite into ~19min
# and FROZE the build loop (3x). Prompt + hook fixes did not hold (subagents run in
# bypassPermissions and skip plugin hooks). Disabling testmon globally caps ANY full-suite
# run at ~2.5min — environment-level, works regardless of agent behaviour. The gate already
# sets -p no:testmon; nothing legitimately uses testmon.
addopts = "--import-mode=importlib -p no:testmon"
# Verification-ladder tiers (GENERATOR.md §8.4). `reality`/`negative`/`e2e` are the
# cassette-backed tiers driven through the real call_external seam via vcrpy; the
# ladder-runner selects tests by these markers. `vcr` is registered by pytest-recording.
markers = [
    "reality: seam-exercise vs a recorded real vendor response (vcrpy cassette)",
    "negative: dependency errors/times out/returns garbage -> honest degradation (negative cassette / real fault)",
    "e2e: golden-path end-to-end over recorded real vendor traffic (--record-mode=none in CI)",
    "integration: assembled-tree db+gcs integration (needs live Postgres/GCS; excluded from the offline tier)",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "pytest-testmon>=2.1.3",
    "pip-audit>=2.7.3",
    "ruff>=0.15.22",
    "vcrpy>=8.3.0",
]
# Integration/reality-tier vendor SDKs. Kept OUT of the default install and any
# package's runtime deps on purpose: the product imports them lazily and degrades
# honestly when absent (see notes_artifact.py). This opt-in group
# provisions them for running the `reality`/`integration` tiers against real vendors:
#   uv sync --group reality
# - anthropic: the real Claude SDK the reality cassettes record against.
# - google-cloud-storage: the finalized-notes Plane 2 GCS writer (§3.3).
reality = [
    "anthropic>=0.39",
    "google-cloud-storage>=2.14",
]
# Real-data eval harness (v2 build-loop rung-2). Kept OUT of the default install:
# deepeval pulls a heavy transitive set that would perturb the shared lock. Opt in with
#   uv sync --group eval
# Used only by tests/eval/ + the `done-check` real-data-eval conjunct.
eval = [
    "deepeval>=1.0",
]
