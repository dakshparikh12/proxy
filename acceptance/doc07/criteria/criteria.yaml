# criteria.yaml — Doc 07 (Post-Meeting Execution)
# One criterion per Doc 07 Appendix C seed. 16 seeds -> 16 criteria.
# None merged, none invented, none split. Ladders derived per GENERATOR.md §8.4.
# Generated 2026-07-27 against 07-POST-MEETING-EXECUTION.md as landed in commit 720d5aa.
#
# ── STRUCTURE ─────────────────────────────────────────────────────────────────
# 16 positive criteria (one per Appendix C seed) + 14 paired AC-…-NEG criteria, one for
# every criterion whose dependency_class is non-null (GENERATOR.md §8.4.1). AC-PME-13 and
# AC-PME-14 carry dependency_class: null and correctly take no NEG pair. Total: 30.
# NEG ladders are {lint, unit, negative} per the §8.4 derivation — reality/integration
# drop off the pair because the negative rung IS that pair's real-fault exercise.
#
# ── BLOCKED CRITERIA (4 of 30) ────────────────────────────────────────────────
# A criterion is marked `blocked:` when it rests on a dependency the repo audit found
# ABSENT *outside Doc 07's own build scope* — it cannot be satisfied even after Doc 07
# is fully implemented.
#   meeting_runtime worker with no media session ABSENT (Doc 07 §3.5)
#     -> AC-PME-09, AC-PME-09-NEG, AC-PME-10, AC-PME-10-NEG
#
# ── UNBLOCKED SINCE THE FIRST CUT ─────────────────────────────────────────────
# clarify_items (was blocking AC-PME-03/04): founder ruling C-C, 2026-07-27 — Doc 07
#   creates and owns the table until Doc 06 lands. Created by migration 0010 on this
#   branch, with co-ownership noted in the migration. No longer a blocker.
# libs/llm structured output (was blocking AC-PME-01/06): the repo's real structured
#   -output path is the Agent SDK provider seam driven through call_external
#   (services/scribe/src/scribe/close.py:38, outputFormat json_schema). Doc 07's triage
#   call rides that SAME seam, so the dependency is vendor:anthropic via call_external,
#   which exists. Recorded as a build note on AC-PME-01, not a blocker.
#
# ── EXPECTED-PENDING, NOT BLOCKED ─────────────────────────────────────────────
# `post_meeting_tasks` and the [post_meeting] config section are Doc 07's OWN artifacts.
# Per GENERATOR.md §1.1 criteria are authored BEFORE implementation, so their absence is
# the normal pre-build state, not a blocker. Both land on this branch (migrations
# 0009/0010 and config/defaults.toml).

# ── INTAKE & TRIAGE ───────────────────────────────────────────────────────────
- criterion_id: AC-PME-01
  name: Every action item receives exactly one tier and the close record is unmodified
  evidence_class: '[integration]'
  authority_refs:
  - R-doc07-PME-01
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: vendor:anthropic
  mock_boundary: >-
    may mock the Anthropic HTTP response body via a vcrpy cassette at the
    call_external/transport layer; MUST NOT replace the call_external seam, the request
    construction, or the client object with Mock() — the real structured triage request
    must be built and driven through the real seam at least once
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: reality
  build_note:
    subject: structured output on the sonnet seat
    detail: >-
      libs/llm exposes only call_model() (client.py:114); routing.py:17-19 names the seat
      but there is no structured-output entrypoint there. This is NOT a blocker: the
      repo's real structured-output path is the Agent SDK provider seam driven through
      call_external, already in production use at services/scribe/src/scribe/close.py:38
      with outputFormat json_schema. Doc 07's triage call MUST ride that same seam —
      which is why this criterion's dependency_class is vendor:anthropic and its
      mock_boundary forbids replacing call_external. A builder who adds a second,
      parallel model-call path to libs/llm for triage has violated the mock_boundary and
      this criterion's reality rung will not produce a valid cassette.
  behavior:
    given: >-
      A completed Doc 03 close pass whose final object contains N action items of mixed
      shape, and a pinned copy of the rendered close record.
    when: Post-meeting intake reads the close output once.
    then:
    - Every one of the N action items carries exactly one tier from {informational, question, ticket, ticket+plan, ticket+plan+draft}
    - No action item carries zero tiers and none carries two
    - The close record is byte-identical to the pinned copy after intake completes
  applicability:
    fixtures: [fixture-close-output-mixed-items]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Tiering is content-shaped, not repository-shaped; one clean estate suffices."
  primary_oracle:
    type: deterministic_comparison
    artifact: "assert len(tiers_assigned) == N and all tiers in enum; assert sha256(close_record_after) == sha256(close_record_before)"
  thresholds:
    items_without_exactly_one_tier: 0
    close_record_bytes_changed: 0
  fault_model_refs:
  - F-ITEM-UNTIERED
  - F-CLOSE-RECORD-MUTATED
  test_ids:
  - T-PME-01

- criterion_id: AC-PME-02
  name: Total failure of post-meeting execution leaves the close and the record untouched
  evidence_class: '[fault-injection]'
  authority_refs:
  - R-doc07-PME-02
  criticality: P0
  blocking: true
  golden_path: true
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; no in-memory substitute for the integration tier. The fault is
    injected into post-meeting execution, never into the close path under observation.
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  - tier: e2e
  behavior:
    given: >-
      A meeting driven through Doc 04's ordered close to completion, with post-meeting
      execution configured to raise on entry (and, in a second arm, to be absent entirely).
    when: The meeting ends and the ordered close runs.
    then:
    - The ordered close completes in its specified order and the notes link posts in chat
    - The finalized notes object in GCS is byte-identical to the control run without post-meeting execution
    - The failure is surfaced in logs and does not propagate into the close path
    - No operation_runs row belonging to the close is left non-terminal
  applicability:
    fixtures: [fixture-meeting-close-e2e]
    estates: [small-clean]
    excluded_estates: []
    rationale: "This is the doc's isolation promise; it must hold on the real close path."
  primary_oracle:
    type: differential_comparison
    artifact: "diff(close_artifacts_with_failing_doc07, close_artifacts_control) == empty"
  thresholds:
    close_artifact_bytes_changed: 0
    close_steps_skipped: 0
  fault_model_refs:
  - F-DOC07-RAISES-INTO-CLOSE
  - F-DOC07-DELAYS-TEARDOWN
  test_ids:
  - T-PME-02

# ── AMBIGUITY & OWNERSHIP ─────────────────────────────────────────────────────
- criterion_id: AC-PME-03
  name: An item lacking owner, scope, or done-condition is never planned and becomes a question
  evidence_class: '[integration]'
  authority_refs:
  - R-doc07-PME-03
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: "real Postgres only; no in-memory substitute for the integration tier"
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  ruling_note:
    subject: "C-C — clarify_items ownership (RESOLVED 2026-07-27)"
    detail: >-
      Was BLOCKED: the table did not exist and Doc 06 §3.6 ("written here, completed by
      Doc 07") disagreed with Doc 07 §3.3 (Doc 07 creates rows) about who owns it.
      Founder ruling: Doc 07 creates and owns clarify_items until Doc 06 lands, with
      co-ownership recorded in the migration. Created by migration 0010 on this branch.
      No longer blocked.
  behavior:
    given: >-
      A triaged action item missing at least one of: an owner, a scope, a stated
      done-condition.
    when: Triage and planning run over the item.
    then:
    - No plan is written for the item
    - A clarify_items row is created carrying the question, its kind, and a blocking_ref back to the item
    - The task remains in CLARIFYING and does not advance toward APPROVED
  applicability:
    fixtures: [fixture-underspecified-action-items]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Pure content/state behavior against the durable substrate."
  primary_oracle:
    type: state_transition_check
    artifact: "assert task.state == 'CLARIFYING' and task.plan is None and clarify_items row exists with blocking_ref == item_ref"
  thresholds:
    plans_written_for_underspecified_items: 0
    missing_clarify_rows: 0
  fault_model_refs:
  - F-PLAN-WITHOUT-OWNER
  - F-SILENT-DROP-OF-AMBIGUOUS-ITEM
  test_ids:
  - T-PME-03

- criterion_id: AC-PME-04
  name: A question with no attributed person or no channel stays pending on the task record
  evidence_class: '[integration]'
  authority_refs:
  - R-doc07-PME-04
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: "real Postgres only; no in-memory substitute for the integration tier"
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  ruling_note:
    subject: "C-C — clarify_items ownership (RESOLVED 2026-07-27)"
    detail: >-
      Was BLOCKED on the table's absence; resolved by the same C-C ruling as AC-PME-03 and
      created by migration 0010. Separately, this criterion was never blocked on the lack
      of an out-of-meeting channel: Doc 08 draft cards are BUILT
      (libs/contracts/src/contracts/channel.py:163 class DraftCard;
      services/transport/src/transport/chat.py:339 format_draft_card), so the "surfaces on
      the draft cards" arm of Doc 07 §3.3 is satisfiable today and P6 stayed deferred.
  behavior:
    given: >-
      A clarifying question whose item has no person the notes attribute it to, or a
      tenant with no out-of-meeting channel in channel-report.
    when: Routing of the clarifying question is attempted.
    then:
    - The question is not sent to any channel
    - The question remains pending on the task record and is exposed on the draft card surface
    - The item is held and does not advance toward APPROVED
  applicability:
    fixtures: [fixture-unattributed-question, fixture-tenant-no-dm-channel]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Routing fallback is substrate-level, not repository-shaped."
  primary_oracle:
    type: state_transition_check
    artifact: "assert clarify_item.answered_by is None and task.state == 'CLARIFYING' and sent_message_count == 0"
  thresholds:
    messages_sent_without_channel: 0
    items_advanced_while_pending: 0
  fault_model_refs:
  - F-QUESTION-SENT-TO-NOBODY
  - F-ITEM-PROCEEDS-WHILE-PENDING
  test_ids:
  - T-PME-04

- criterion_id: AC-PME-05
  name: Ambiguous ownership records UNRESOLVED and is never inferred
  evidence_class: '[unit-property]'
  authority_refs:
  - R-doc07-PME-05
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: "real Postgres only; no in-memory substitute for the integration tier"
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  behavior:
    given: >-
      A corpus of action items in which ownership is absent, and whose surrounding notes
      contain strong but non-normative ownership signals: a most-senior speaker, a
      highest-word-count speaker, and a last-toucher of the referenced file.
    when: Ownership is resolved for each item.
    then:
    - owner is the literal string UNRESOLVED for every item with no owner stated in the room
    - owner is never equal to the senior speaker, the dominant speaker, or the file's last author unless the room named them
    - UNRESOLVED is distinct from empty string and from NULL
    - Every UNRESOLVED item is held at the question tier
  applicability:
    fixtures: [fixture-ownership-decoys]
    estates: [small-clean]
    excluded_estates: []
    rationale: "The decoys are the point; a synthetic corpus exercises them precisely."
  primary_oracle:
    type: invariant
    artifact: "for each item without a stated owner: assert owner == 'UNRESOLVED' and owner not in {senior_speaker, dominant_speaker, last_file_author}"
  thresholds:
    inferred_owners: 0
    unresolved_conflated_with_empty: 0
  fault_model_refs:
  - F-OWNER-INFERRED-FROM-SENIORITY
  - F-UNRESOLVED-STORED-AS-EMPTY
  test_ids:
  - T-PME-05

- criterion_id: AC-PME-06
  name: Failing any draft-tier condition drops the item at least one tier
  evidence_class: '[eval]'
  authority_refs:
  - R-doc07-PME-06
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: vendor:anthropic
  mock_boundary: >-
    may mock the Anthropic HTTP response body via a vcrpy cassette at the
    call_external/transport layer; MUST NOT replace the call_external seam or the
    structured triage request construction with Mock()
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: reality
  build_note:
    subject: structured output on the sonnet seat
    detail: >-
      Same seam as AC-PME-01 — the Agent SDK provider seam through call_external, not a
      new libs/llm entrypoint. Not a blocker. Note that tier assignment is model judgment
      per Doc 07 §3.1 and Law 4 ("no rule table mapping item text to a tier"), so this
      criterion can never be satisfied by deterministic code standing in for the judge;
      the rule_table_lookups_detected threshold below is what enforces that.
  behavior:
    given: >-
      A labelled corpus of action items, each violating exactly one draft-tier condition:
      no concrete scope; no clear area of the codebase; too large to review in one sitting;
      material ambiguity present; no stated way to tell it worked.
    when: Triage assigns a tier to each item.
    then:
    - No item in the corpus receives the ticket+plan+draft tier
    - Each item's tier is at least one level below ticket+plan+draft
    - The tier assignment is produced by the model judge, not by a rule table keyed on item text
  applicability:
    fixtures: [fixture-draft-tier-violations]
    estates: [small-clean]
    excluded_estates: []
    rationale: "One labelled corpus per violated condition is the only way to test the policy."
  primary_oracle:
    type: labelled_corpus_comparison
    artifact: "goldens/doc07-draft-tier-violations.json — assert tier < 'ticket+plan+draft' for every labelled violation"
  thresholds:
    draft_tier_granted_to_violating_item: 0
    rule_table_lookups_detected: 0
  fault_model_refs:
  - F-DRAFT-TIER-ON-AMBIGUOUS-ITEM
  - F-TIER-FROM-HARDCODED-RULE-TABLE
  test_ids:
  - T-PME-06

# ── THE APPROVAL GATE ─────────────────────────────────────────────────────────
- criterion_id: AC-PME-07
  name: Nothing runs and nothing durable is written before a named human approves
  evidence_class: '[security-adversarial]'
  authority_refs:
  - R-doc07-PME-07
  criticality: P0
  blocking: true
  golden_path: true
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; the sandbox provider and the model seat are observed, never
    replaced with permissive stubs — a stub that silently allows the call would invert
    this criterion
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  - tier: e2e
  behavior:
    given: A task that has been triaged and planned but whose plan has not been approved.
    when: >-
      The system is driven through every pre-approval path, including an adversarial
      attempt to dispatch the task directly.
    then:
    - No sandbox is provisioned (the sandbox provider records zero calls)
    - No model call is made beyond the triage call and the plan call
    - No durable write occurs to any table other than the task's own record
    - The task cannot enter RUNNING from any state other than APPROVED
    - approved_by and approved_at are both non-null on any transition into APPROVED
  applicability:
    fixtures: [fixture-unapproved-plan, fixture-adversarial-direct-dispatch]
    estates: [small-clean]
    excluded_estates: []
    rationale: "This is Law 3 and Invariant 6 applied to the run; it is the doc's safety boundary."
  primary_oracle:
    type: invariant
    artifact: >-
      assert sandbox_provider.call_count == 0 and model_calls <= {triage, plan} and
      set(tables_written) <= {'post_meeting_tasks', 'clarify_items'} and no RUNNING
      transition whose predecessor state != 'APPROVED'
  thresholds:
    sandboxes_started_before_approval: 0
    durable_writes_outside_task_record: 0
    running_transitions_not_from_approved: 0
    approved_rows_missing_approver_identity: 0
  fault_model_refs:
  - F-SANDBOX-BEFORE-APPROVAL
  - F-RUNNING-FROM-PLANNED
  - F-APPROVED-WITHOUT-NAMED-HUMAN
  notes:
    contradiction_ref: C-D
    contradiction_note: >-
      RESOLVED 2026-07-27 by founder ruling. This criterion's third assertion once
      contradicted AC-PME-03, which requires a clarify_items write while the task is in
      CLARIFYING — strictly before APPROVED. Ruling: clarify_items is carved out of the
      pre-approval durability invariant, and the carve-out is CLOSED — it is the only
      exempt table, because asking a question is not a world-change. Doc 07 §3.4 now says
      so in the spec. The threshold below is therefore no longer provisional: the
      permitted write set before APPROVED is exactly {post_meeting_tasks, clarify_items},
      and a write to any third table fails this criterion.
  test_ids:
  - T-PME-07

- criterion_id: AC-PME-08
  name: An unanswered plan expires quietly without proceeding
  evidence_class: '[integration]'
  authority_refs:
  - R-doc07-PME-08
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; time is advanced via an injected clock, never by sleeping —
    the expiry comparison itself must execute
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  behavior:
    given: A planned task whose owner never responds, and a clock advanced past plan_expiry.
    when: The expiry sweep runs.
    then:
    - The task closes without entering APPROVED or RUNNING
    - No further notification is sent to the owner after the plan was first delivered
    - No sandbox is provisioned at any point
    - The task's terminal outcome records expiry as the reason
  applicability:
    fixtures: [fixture-expired-plan]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Time-driven lifecycle behavior against the durable substrate."
  primary_oracle:
    type: state_transition_check
    artifact: "assert task.state is terminal and task.outcome names expiry and notifications_after_first == 0"
  thresholds:
    notifications_after_expiry: 0
    tasks_proceeding_after_expiry: 0
  fault_model_refs:
  - F-NAG-AFTER-EXPIRY
  - F-PROCEED-BY-DEFAULT-ON-SILENCE
  test_ids:
  - T-PME-08

# ── EXECUTION ─────────────────────────────────────────────────────────────────
- criterion_id: AC-PME-09
  name: Dispatch uses Doc 04's bundle and Doc 05's Workroom, and no second execution path exists
  evidence_class: '[static]'
  authority_refs:
  - R-doc07-PME-09
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; the static arm is pure AST/grep over the source tree and mocks
    nothing
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  blocked:
    status: BLOCKED
    blocking_dependency: "meeting_runtime worker runnable with no media session"
    dependency_owner: services/harness
    evidence: >-
      services/harness/src/harness/meeting_runtime.py:54 MeetingRuntime is media-coupled by
      construction: it owns `carrier`, a live HearingStage (`_hearing`), the Scribe consumer,
      a consent_gate, and an STT credential-refresh loop. No no-media entrypoint and no
      worker `main()` exist — grep for '__main__|def main(' across services/harness/src/harness
      returns zero hits (audit 2026-07-27).
    consequence: >-
      Doc 07 §3.5 requires the Workroom package to run "in a meeting_runtime worker with no
      media session — no transport, no Scribe, no tile" and asserts "No new deployable".
      Today there is no way to start that worker without media. Either a no-media mode is
      added to MeetingRuntime, or Doc 07 §3.5 is amended.
  behavior:
    given: An approved task ready for dispatch.
    when: The task is dispatched and the source tree is scanned.
    then:
    - Dispatch constructs the bundle via Doc 04's existing assemble_bundle and no other constructor
    - The bundle reaches Doc 05's Workroom unchanged
    - Static scan finds no second sandbox provider, agent framework, task queue, scheduler, or broker introduced by Doc 07
    - The Workroom returns the standard envelope
  applicability:
    fixtures: [fixture-approved-task]
    estates: [small-clean]
    excluded_estates: []
    rationale: "One arm is behavioral, one is a whole-tree static assertion."
  primary_oracle:
    type: static_plus_contract
    artifact: >-
      AST assert the only Bundle construction on the doc07 path resolves to
      harness.dispatch.assemble_bundle; grep-assert no new provider/queue/scheduler symbol
      introduced under the doc07 module
  thresholds:
    second_execution_paths: 0
    non_canonical_bundle_constructors: 0
  fault_model_refs:
  - F-PARALLEL-TASK-QUEUE
  - F-BUNDLE-REBUILT-LOCALLY
  test_ids:
  - T-PME-09

- criterion_id: AC-PME-10
  name: A run is exactly one operation_runs row and survives worker recycle
  evidence_class: '[process]'
  authority_refs:
  - R-doc07-PME-10
  criticality: P0
  blocking: true
  golden_path: true
  dependency_class: db:postgres
  mock_boundary: >-
    real Postgres only; the worker is killed as a real process (SIGKILL), never simulated
    by setting a flag — the reclaim path must actually execute
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  - tier: e2e
  blocked:
    status: BLOCKED
    blocking_dependency: "meeting_runtime worker runnable with no media session"
    dependency_owner: services/harness
    evidence: >-
      Same as AC-PME-09. There is no media-less worker to recycle, so the recycle arm of
      this criterion cannot be executed as specified.
    consequence: >-
      The one-row arm is testable today against libs/ops/claim.py and
      libs/ops/reconcile.py; the survive-recycle arm is not.
  behavior:
    given: A dispatched task running in a worker.
    when: The worker process is killed mid-run and reconcile sweeps.
    then:
    - Exactly one operation_runs row exists for the task at all times, keyed scope_id=meeting_id and operation_type='workroom:{task_id}'
    - No second run table is written; post_meeting_tasks holds lifecycle state only and never duplicates the run record
    - The killed run is reclaimed by the same atomic claim, heartbeat and reconcile Doc 05 §3.1 defines
    - The reclaimed run resumes from its persisted progress rather than restarting from zero
  applicability:
    fixtures: [fixture-worker-kill]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Crash-recovery is only meaningful against a real process and a real database."
  primary_oracle:
    type: invariant
    artifact: >-
      assert count(operation_runs WHERE task) == 1 at every observation point; assert
      post_meeting_tasks has no status/heartbeat/progress column duplicating the run
  thresholds:
    operation_runs_rows_per_task: 1
    second_run_tables: 0
    unreclaimed_runs_after_reconcile: 0
  fault_model_refs:
  - F-SECOND-RUN-TABLE
  - F-ORPHANED-RUN-AFTER-KILL
  notes:
    contradiction_ref: C-A
    contradiction_note: >-
      RESOLVED 2026-07-27 by founder ruling (amendment P10). Doc 07 §3.5 had put the task
      id in BOTH scope_id and operation_type; CANONICAL §11.2 agreed with the doc; the
      built code did the opposite split. Ruling: the code is right and the spec was wrong.
      The canonical shape is now, everywhere:
        scope_id       = meeting_id (cast to text at the one call site)
        operation_type = 'workroom:{task_id}'
      Ground truth: services/harness/src/harness/dispatch.py:129-145 and
      libs/ops/src/ops/cost.py:323. No code was changed; Doc 07 §3.5 and CANONICAL §11.2
      were conformed to it. Because the partial unique index
      operation_runs_one_running_per_scope is on (scope_id, operation_type), the one-row
      assertion below now has a fixed meaning: exactly one running row per
      (meeting, task).
  test_ids:
  - T-PME-10

- criterion_id: AC-PME-11
  name: Reaching a concurrency or per-meeting cap makes further dispatch wait
  evidence_class: '[integration]'
  authority_refs:
  - R-doc07-PME-11
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: "real Postgres only; the cap comparison must execute against real claimed rows"
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: integration
  behavior:
    given: >-
      A tenant at max_concurrent_tasks and, in a second arm, a meeting at
      max_tasks_per_meeting.
    when: An additional approved task is dispatched.
    then:
    - The additional task waits rather than starting
    - The number of concurrently running tasks never exceeds the cap
    - The waiting task is not dropped, failed, or silently discarded
    - The task starts once a slot frees
  applicability:
    fixtures: [fixture-tenant-at-concurrency-cap, fixture-meeting-at-task-cap]
    estates: [small-clean, multi-tenant]
    excluded_estates: []
