# dependency_manifest.yaml — Doc 07 (Post-Meeting Execution)
# Emitted per GENERATOR.md §8.4.3. One entry per real external dependency the spec requires.
# Bidirectionally consistent with criteria/criteria.yaml: every class here is carried by the
# criteria listed, and every non-null dependency_class in the criteria appears here.
# Generated 2026-07-27.
doc: doc07

dependencies:
  - dependency_class: db:postgres
    kind: local
    seam: libs/db
    real_object: >-
      libs/ops/claim.py (atomic claim), libs/ops/reconcile.py (reconcile sweep),
      libs/db/repos/* (row access). Doc 07 adds post_meeting_tasks; the run itself stays
      the operation_runs row created by services/harness/dispatch.py.
    mock_boundary: >-
      real Postgres only; no in-memory substitute for the integration tier. Where a
      criterion observes the sandbox provider or a git remote for zero calls, that
      observer MUST NOT be a permissive stub — a stub that silently allows the call
      would invert the criterion it is meant to prove.
    cassette_glob: null
    criteria:
      - AC-PME-02
      - AC-PME-03
      - AC-PME-04
      - AC-PME-05
      - AC-PME-07
      - AC-PME-08
      - AC-PME-09
      - AC-PME-10
      - AC-PME-11
      - AC-PME-12
      - AC-PME-15
      - AC-PME-16
    golden_path_criteria:
      - AC-PME-02
      - AC-PME-07
      - AC-PME-10
      - AC-PME-15

  - dependency_class: vendor:anthropic
    kind: vendor
    seam: libs/http call_external
    real_object: >-
      The structured triage/plan call on the claude-sonnet-4-6 seat named in
      libs/llm/src/llm/routing.py:17-19. NOTE: the structured-output entrypoint this
      requires does not yet exist on libs/llm (see blocked_dependencies below).
    mock_boundary: >-
      may mock the Anthropic HTTP response body via a vcrpy cassette at the
      call_external/transport layer; MUST NOT replace the call_external seam, the request
      construction, or the client object with Mock() — the real structured request must be
      built and driven through the real seam at least once.
    cassette_glob: tests/cassettes/doc07_triage_*.yaml
    criteria:
      - AC-PME-01
      - AC-PME-06
    golden_path_criteria: []

# Criteria that rest on nothing outside the process (dependency_class: null) and so appear
# in no entry above: AC-PME-13, AC-PME-14. Both are pure envelope->report mappings.

golden_path:
  rationale: >-
    Four criteria, one per irreversible or trust-defining promise Doc 07 makes. These are
    the ones a founder would point at to say "this is the product working safely".
  criteria:
    - criterion_id: AC-PME-02
      promise: "Post-meeting execution can never damage the meeting record or the close."
    - criterion_id: AC-PME-07
      promise: "Nothing runs before a named human approves — Law 3 applied to the run."
    - criterion_id: AC-PME-10
      promise: "One operation_runs row is the whole truth of a run, and it survives a crash."
    - criterion_id: AC-PME-15
      promise: "What lands in the world is a proposed draft behind a human click, never a push."

# ── Dependencies the 2026-07-27 audit found ABSENT ────────────────────────────
# These are NOT verification dependencies of a working system; they are build blockers
# recorded here so the manifest is honest about what cannot yet be exercised at all.
