# ── REPORTING ─────────────────────────────────────────────────────────────────
- criterion_id: AC-PME-13
  name: needs_clarification is reported as a question, never as a failure
  evidence_class: '[unit-example]'
  authority_refs:
  - R-doc07-PME-13
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: null
  verification_ladder:
  - tier: lint
  - tier: unit
  behavior:
    given: A Workroom envelope returned with status needs_clarification and its one question.
    when: The report for that task is rendered.
    then:
    - The report is classified as a question, presented as blocked-on-you
    - The report is not classified as a failure and carries no failure language
    - The envelope's question is carried into the report verbatim
  applicability:
    fixtures: [fixture-envelope-needs-clarification]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Pure in-process mapping from envelope status to report class; no external dependency."
  primary_oracle:
    type: deterministic_comparison
    artifact: "assert report.kind == 'question' and report.kind != 'failure' and report.question == envelope.question"
  thresholds:
    needs_clarification_reported_as_failure: 0
  fault_model_refs:
  - F-CLARIFICATION-REPORTED-AS-FAILURE
  test_ids:
