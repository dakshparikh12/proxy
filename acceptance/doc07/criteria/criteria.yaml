      The concurrent-claim arm is testable today against libs/ops/claim.py; the
      worker-fault arm is not.
  behavior:
    given: Two workers claiming the same task simultaneously, and separately a database fault mid-run.
    when: Both claims race, and the fault fires.
    then:
    - Exactly one claim succeeds; the loser gets no row and does not proceed
    - The partial unique index on (scope_id, operation_type) is what rejects the duplicate, not an application lock
    - A mid-run fault leaves at most one row for the task, never a duplicate
    - Reconcile reclaims the row rather than creating a second one
  applicability:
    fixtures: [fixture-concurrent-claim, fixture-midrun-db-fault]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Duplicate run rows are the corruption this criterion exists to prevent."
  primary_oracle:
    type: invariant
    artifact: "assert successful_claims == 1 and at most one operation_runs row for the task at every observation"
  thresholds:
    duplicate_run_rows: 0
    claims_succeeding_concurrently: 1
  fault_model_refs:
  - F-DUPLICATE-RUN-ROW-UNDER-RACE
  - F-APP-LOCK-REPLACES-INDEX
  test_ids:
  - T-PME-10-NEG

- criterion_id: AC-PME-11-NEG
  name: A cap-read failure holds dispatch rather than admitting unbounded work
  evidence_class: '[fault-injection]'
  authority_refs:
  - R-doc07-PME-11
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real fault only — the running-task count query fails or returns malformed data; no
    stub that returns a convenient zero
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: negative
  behavior:
    given: A dispatch attempt where the concurrency count query errors or returns a malformed value.
    when: The cap is evaluated.
    then:
    - Dispatch is held rather than admitted — the cap check fails CLOSED
    - An unreadable count is never treated as zero
    - The held task is not dropped and becomes dispatchable once the count is readable
    - Concurrency never exceeds the configured cap as a result of the fault
  applicability:
    fixtures: [fixture-cap-query-fails]
    estates: [small-clean, multi-tenant]
    excluded_estates: []
    rationale: "Treating an unreadable count as zero is the classic fail-open in cap logic."
  primary_oracle:
    type: fault_injection_check
    artifact: "assert dispatched == 0 while the count is unreadable and observed concurrency stays within the cap"
  thresholds:
    dispatches_on_unreadable_count: 0
    cap_exceeded_via_fault: 0
  fault_model_refs:
  - F-UNREADABLE-COUNT-TREATED-AS-ZERO
  - F-CAP-FAILS-OPEN
  test_ids:
  - T-PME-11-NEG

- criterion_id: AC-PME-12-NEG
  name: An unavailable cost estimate blocks the sandbox rather than assuming it is cheap
  evidence_class: '[fault-injection]'
  authority_refs:
  - R-doc07-PME-12
  criticality: P1
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real fault only — the estimate or persisted-cost read fails; the sandbox provider is
    observed for zero calls and MUST NOT be a permissive stub
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: negative
  behavior:
    given: A task whose pre-dispatch cost estimate cannot be computed or whose meeting_cost read fails.
    when: Dispatch is attempted.
    then:
    - No sandbox is provisioned
    - An unavailable estimate is not treated as under the ceiling
    - The owner is asked, or the task is held, but spend never begins
    - The condition is reported rather than silently retried until it succeeds
  applicability:
    fixtures: [fixture-estimate-unavailable]
    estates: [small-clean]
    excluded_estates: []
    rationale: "Assuming cheap on an unreadable estimate is how a cost ceiling silently stops working."
  primary_oracle:
    type: fault_injection_check
    artifact: "assert sandbox_provider.call_count == 0 and cost_delta == 0"
  thresholds:
    sandboxes_started_without_estimate: 0
    spend_without_estimate: 0
  fault_model_refs:
  - F-MISSING-ESTIMATE-TREATED-AS-CHEAP
  - F-SILENT-RETRY-UNTIL-SPEND
  test_ids:
  - T-PME-12-NEG

- criterion_id: AC-PME-15-NEG
  name: A staging failure never leaves a half-written draft or reaches for a push
  evidence_class: '[security-adversarial]'
  authority_refs:
  - R-doc07-PME-15
  criticality: P0
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real fault only — the GCS bundle write fails, or the staged_drafts insert is rejected;
    the git remote is observed for zero write operations and is never a permissive stub
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: negative
  behavior:
    given: A completed code-change task where the GCS bundle write fails, and separately where the staged_drafts insert is rejected.
    when: Staging is attempted.
    then:
    - No staged_drafts row exists without its corresponding retrievable bundle
    - No push, branch creation, or pull request is attempted as a fallback delivery route
    - The failure is reported plainly and the task does not report success
    - A row written at any status outside the enum is rejected by the database CHECK constraint
  applicability:
    fixtures: [fixture-gcs-write-fails, fixture-draft-insert-rejected]
    estates: [small-clean]
    excluded_estates: []
    rationale: "The tempting fallback when staging fails is to push; this pins that closed."
  primary_oracle:
    type: invariant
    artifact: "assert orphaned_draft_rows == 0, git remote write operations == 0, and the DB rejects an out-of-enum status"
  thresholds:
    pushes_on_staging_failure: 0
    orphaned_draft_rows: 0
    rows_accepted_outside_enum: 0
  fault_model_refs:
  - F-PUSH-AS-STAGING-FALLBACK
  - F-DRAFT-ROW-WITHOUT-BUNDLE
  test_ids:
  - T-PME-15-NEG

- criterion_id: AC-PME-16-NEG
  name: A send failure never retries onto an unlisted channel or drops the report silently
  evidence_class: '[fault-injection]'
  authority_refs:
  - R-doc07-PME-16
  criticality: P2
  blocking: true
  golden_path: false
  dependency_class: db:postgres
  mock_boundary: >-
    real fault only — the send fails or the recipient set read errors; the channel senders
    are observed for call sites and never replaced by a stub accepting any channel
  verification_ladder:
  - tier: lint
  - tier: unit
  - tier: negative
  behavior:
    given: A reportable event whose delivery on the selected channel fails, and separately whose recipient set cannot be read.
    when: Reporting retries.
    then:
    - Retries stay within the channels present in channel-report for that meeting
    - No unlisted channel is attempted as a fallback
    - A permanently undeliverable report surfaces on the draft card rather than vanishing
    - No duplicate report is delivered when a retry follows a send that actually succeeded
  applicability:
    fixtures: [fixture-send-fails, fixture-recipients-unreadable]
    estates: [small-clean, multi-tenant]
    excluded_estates: []
    rationale: "Retry logic is where channel discipline and idempotency usually break."
  primary_oracle:
    type: contract_check
    artifact: "assert every channel attempted is present in channel-report and duplicate_deliveries == 0"
  thresholds:
    unlisted_channels_attempted: 0
    reports_silently_dropped: 0
    duplicate_deliveries: 0
  fault_model_refs:
  - F-RETRY-ONTO-UNLISTED-CHANNEL
  - F-DUPLICATE-REPORT-ON-RETRY
  test_ids:
  - T-PME-16-NEG
