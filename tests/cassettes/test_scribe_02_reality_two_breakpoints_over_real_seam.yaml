      micro-call's output \u2014 a DELTA, never a rewrite of the object.\",\"properties\":{\"ops\":{\"items\":{\"anyOf\":[{\"$ref\":\"#/$defs/AddOp\"},{\"$ref\":\"#/$defs/PatchOp\"},{\"$ref\":\"#/$defs/CloseOp\"}]},\"maxItems\":40,\"title\":\"Ops\",\"type\":\"array\"},\"current_goal\":{\"anyOf\":[{\"maxLength\":200,\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Current
      Goal\"}},\"title\":\"NoteDelta\",\"type\":\"object\"}}]}"
