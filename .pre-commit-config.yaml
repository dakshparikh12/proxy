# Every guard runs in BOTH pre-commit AND CI (see .github/workflows/guards.yml).
# Guard parity is enforced by the acceptance suite: no guard may be CI-only or
# pre-commit-only.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: check-secret-bindings
        name: check-secret-bindings
        entry: python -m ops.check_secret_bindings
        language: system
        pass_filenames: false

      # check-migration-order: Alembic single-head vs origin/main (fail-loud-never-skip).
      - id: check-migration-order
        name: check-migration-order
        entry: python -m alembic heads
        language: system
        pass_filenames: false

      # check-sdk-isolation-triad: every query() call site must set the triad
      # flags and the SDK_LOCAL_TOOLS block-list.
      - id: check-sdk-isolation-triad
        name: check-sdk-isolation-triad
        entry: python -m ops.check_sdk_isolation_triad --require SDK_LOCAL_TOOLS --every query-call
        language: system
        pass_filenames: false

      # check-call-external: the §14 single-seam invariant — every raw vendor-client
      # construction (AsyncAnthropic/httpx/GCS/Recall/STT) lives ONLY in the libs/http
      # call_external seam. Same guard runs in CI (guard parity).
      - id: check-call-external
        name: check-call-external
        entry: python -m ops.check_call_external
        language: system
        pass_filenames: false

      # banned-strings: enumerated dead tokens must never reappear. (Note: the
      # revived per-meeting GCE-MIG runtime term is intentionally NOT banned.)
      - id: banned-strings
        name: banned-strings
        entry: python -m ops.check_banned_strings
        language: system
        pass_filenames: false

      # field-contract: shared field-contract JSON must match emitters.
      - id: field-contract
        name: field-contract
        entry: python -m ops.check_field_contract
        language: system
        pass_filenames: false

      # naming-lint: no internal component name (Orchestrator/Scribe/workroom) in a
      # user-visible string (§14 naming law). Runs beside the copy guide below.
      - id: naming-lint
        name: naming-lint
        entry: python -m lint.naming
        language: system
        pass_filenames: false

      # copy-guide: Doc 08 §2.1/§2.3 — fail (never warn) on a banned user-visible-copy
      # pattern ("As an AI", filler, exclamation-theatre) AND assert the three honesty
      # shapes (recuse/unknown/partial) exist as canonical seed strings. The seed
      # artifact (libs/ops/src/lint/copy_seeds.json) is the single source it reads.
      - id: copy-guide
        name: copy-guide
        entry: python -m lint.copy_guide
        language: system
        pass_filenames: false
