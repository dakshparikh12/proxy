    status: ABSENT
    owner: "Doc 06 §4 — co-owned with Doc 07; Doc 06 is SPEC'D, NOT BUILT"
    evidence: "grep -rn 'clarify_items' migrations/ libs/ services/ -> 0 hits"
    blocks: [AC-PME-03, AC-PME-04]
    note: >-
      Contradiction C-C is unresolved: Doc 06 §3.6 says clarify_items is "written here,
      completed by Doc 07"; Doc 07 §3.3 has Doc 07 creating rows. Both cannot be the full
      picture, and the table has no builder while Doc 06 is unbuilt.

  - dependency: meeting_runtime worker runnable with no media session
    status: ABSENT
    owner: services/harness
    evidence: >-
      services/harness/src/harness/meeting_runtime.py:54 — MeetingRuntime is media-coupled
      by construction (carrier, HearingStage, Scribe consumer, consent_gate, STT refresh
      loop). No no-media entrypoint; no worker main() in services/harness/src/harness.
    blocks: [AC-PME-09, AC-PME-10]
    note: >-
      Doc 07 §3.5 requires this worker and simultaneously asserts "No new deployable".
      Either MeetingRuntime gains a no-media mode or §3.5 is amended.

  - dependency: libs/llm structured-output entrypoint on the sonnet seat
    status: ABSENT
    owner: libs/llm
    evidence: >-
      libs/llm/src/llm/routing.py:17-19 names the claude-sonnet-4-6 seats; libs/llm exposes
      only call_model() (client.py:114). grep for
      output_schema|structured_output|json_schema across libs/llm -> 0 hits. The repo's only
      structured-output path is the Agent SDK provider seam at services/scribe/close.py:38.
    blocks: [AC-PME-01, AC-PME-06]
    note: >-
      Doc 07 §3.1 requires "one structured call on the sonnet seat" for tiering, and Law 4
      forbids substituting a rule table, so this cannot be worked around in code.

